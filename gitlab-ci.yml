stages:
  - build
  - test
  - jacoco
  - checkstyle
  - spotbugs
  - unit-test

build:
  stage: build
  script:
    - cd teamproject16
    - mvn compile

test:
  stage: test
  script:
    - cd teamproject16
    - mvn test

jacoco:
  stage: jacoco
  script:
    - cd teamproject16
    - mvn verify

checkstyle:
  stage: checkstyle
  script:
    - cd teamproject16
    - mvn checkstyle:check

spotbugs:
  stage: spotbugs
  script:
    - cd teamproject16
    - mvn spotbugs:check

unit-test:
  stage: unit-test
  image: node:latest
  script:
    - cd frontend
    - npm install vite - save-dev
    - npx vitest run - reporter=junit
  artifacts:
    paths:
      - junit-report.xml
    reports:
      junit:
        - junit-report.xml
