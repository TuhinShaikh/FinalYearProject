# ===============================
# Test Configuration
# ===============================

# Disable DB connection for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===============================
# Disable Security AutoConfig
# ===============================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

# ===============================
# JWT (dummy values for tests)
# ===============================
jwt.secret=TestSecretKeyThatIsAtLeast32BytesLong!!
jwt.accessToken.expiration=900000
jwt.refreshToken.expiration=604800000

# ===============================
# Square API (dummy values)
# ===============================
square.accessToken=dummy
square.environment=sandbox

# ===============================
# Logging
# ===============================
logging.level.org.springframework=ERROR