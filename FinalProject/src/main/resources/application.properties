# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Database (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/yourdb
spring.datasource.username=youruser
spring.datasource.password=yourpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Security / JWT
# ===============================
# Must be at least 32 bytes long for HS256
jwt.secret=ReplaceThisWith32ByteSecretKey!!
jwt.accessToken.expiration=900000       # 15 minutes in ms
jwt.refreshToken.expiration=604800000   # 7 days in ms

# ===============================
# Square API
# ===============================
square.accessToken=EAAA...yourSandboxToken...
square.environment=sandbox

# ===============================
# SpringDoc OpenAPI (Swagger UI)
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.squareup.square=DEBUG