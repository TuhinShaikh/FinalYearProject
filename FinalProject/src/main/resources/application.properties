# ============================================================
# SPRING BOOT \u2014 CORE CONFIG
# ============================================================

# Disable database auto-configuration (you are not using PostgreSQL yet)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Server port (default 8080)
server.port=8080


# ============================================================
# CORS CONFIG (Frontend: http://localhost:5173)
# ============================================================
# Allow your React frontend to call the backend
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# ============================================================
# JWT CONFIG
# ============================================================
jwt.secret=ThisIsASecretKeyThatIsAtLeast32BytesLong!!
jwt.accessToken.expiration=900000
jwt.refreshToken.expiration=604800000


# ============================================================
# SQUARE PAYMENT API
# ============================================================
square.accessToken=dummy
square.environment=sandbox


# ============================================================
# LOGGING
# ============================================================
logging.level.org.springframework=INFO
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR


# ============================================================
# TRAIN API (optional)
# ============================================================
# You can add custom configs here later if needed