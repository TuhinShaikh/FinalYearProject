# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:dev-only-change-me-to-a-32-byte-secret}
jwt.accessToken.expiration=900000
jwt.refreshToken.expiration=604800000

# ===============================
# POSTGRESQL DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/finalproject
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CORS
# ===============================
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ===============================
# SQUARE API
# ===============================
square.accessToken=${SQUARE_ACCESS_TOKEN:set-in-env-for-local-and-ci}
square.environment=sandbox

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR

