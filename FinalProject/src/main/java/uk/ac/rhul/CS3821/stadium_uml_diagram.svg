<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .class-box { fill: white; stroke: black; stroke-width: 2; }
      .class-name { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .attribute { font-family: Arial, sans-serif; font-size: 13px; text-anchor: start; }
      .method { font-family: Arial, sans-serif; font-size: 13px; text-anchor: start; }
      .interface-label { font-family: Arial, sans-serif; font-size: 12px; font-style: italic; text-anchor: middle; }
      .line { stroke: black; stroke-width: 2; fill: none; }
      .diamond { fill: white; stroke: black; stroke-width: 2; }
      .triangle { fill: white; stroke: black; stroke-width: 2; }
    </style>
  </defs>

  <!-- Observer Interface (top) -->
  <g id="observer-interface">
    <rect class="class-box" x="450" y="20" width="200" height="100" rx="5"/>
    <text class="interface-label" x="550" y="45">&lt;&lt;Interface&gt;&gt;</text>
    <text class="class-name" x="550" y="65">Observer</text>
    <line class="line" x1="450" y1="75" x2="650" y2="75"/>
    <text class="method" x="460" y="95">+update(msg: String)</text>
  </g>

  <!-- ObserverManager (center-right) -->
  <g id="observer-manager">
    <rect class="class-box" x="750" y="20" width="220" height="180" rx="5"/>
    <text class="class-name" x="860" y="45">ObserverManager</text>
    <line class="line" x1="750" y1="55" x2="970" y2="55"/>
    <text class="method" x="760" y="75">-managerObserverMap</text>
    <line class="line" x1="750" y1="85" x2="970" y2="85"/>
    <text class="method" x="760" y="105">-ObserverManager()</text>
    <text class="method" x="760" y="125">+getInstance()</text>
    <text class="method" x="760" y="145">+subscribe(o:Observer)</text>
    <text class="method" x="760" y="165">+notify(msg:String)</text>
  </g>

  <!-- UserObserver (left implementation) -->
  <g id="user-observer">
    <rect class="class-box" x="280" y="180" width="140" height="80" rx="5"/>
    <text class="class-name" x="350" y="210">UserObserver</text>
    <line class="line" x1="280" y1="220" x2="420" y2="220"/>
    <text class="method" x="290" y="240">+update()</text>
  </g>

  <!-- NotificationObserver (center-left implementation) -->
  <g id="notification-observer">
    <rect class="class-box" x="450" y="180" width="180" height="80" rx="5"/>
    <text class="class-name" x="540" y="210">NotificationObserver</text>
    <line class="line" x1="450" y1="220" x2="630" y2="220"/>
    <text class="method" x="460" y="240">+update()</text>
  </g>

  <!-- Booking (center) -->
  <g id="booking">
    <rect class="class-box" x="450" y="350" width="200" height="160" rx="5"/>
    <text class="class-name" x="550" y="380">Booking</text>
    <line class="line" x1="450" y1="390" x2="650" y2="390"/>
    <text class="attribute" x="460" y="410">-bookingId: String</text>
    <text class="attribute" x="460" y="430">-userId: String</text>
    <text class="attribute" x="460" y="450">-spotId: String</text>
    <line class="line" x1="450" y1="460" x2="650" y2="460"/>
    <text class="method" x="460" y="480">+createBooking()</text>
    <text class="method" x="460" y="500">+cancelBooking()</text>
  </g>

  <!-- ParkingSpot (left of Booking) -->
  <g id="parking-spot">
    <rect class="class-box" x="80" y="350" width="200" height="180" rx="5"/>
    <text class="class-name" x="180" y="380">ParkingSpot</text>
    <line class="line" x1="80" y1="390" x2="280" y2="390"/>
    <text class="attribute" x="90" y="410">-spotId: String</text>
    <text class="attribute" x="90" y="430">-isAvailable: Boolean</text>
    <text class="attribute" x="90" y="450">-type: String</text>
    <text class="attribute" x="90" y="470">-price: Double</text>
    <line class="line" x1="80" y1="480" x2="280" y2="480"/>
    <text class="method" x="90" y="500">+checkAvailability()</text>
    <text class="method" x="90" y="520">+reserveSpot()</text>
  </g>

  <!-- User (right of Booking) -->
  <g id="user">
    <rect class="class-box" x="720" y="350" width="200" height="180" rx="5"/>
    <text class="class-name" x="820" y="380">User</text>
    <line class="line" x1="720" y1="390" x2="920" y2="390"/>
    <text class="attribute" x="730" y="410">-userId: String</text>
    <text class="attribute" x="730" y="430">-email: String</text>
    <text class="attribute" x="730" y="450">-hashedPassword: String</text>
    <text class="attribute" x="730" y="470">-isDisabled: Boolean</text>
    <line class="line" x1="720" y1="480" x2="920" y2="480"/>
    <text class="method" x="730" y="500">+register()</text>
    <text class="method" x="730" y="520">+login()</text>
  </g>

  <!-- Payment (bottom center) -->
  <g id="payment">
    <rect class="class-box" x="450" y="600" width="200" height="160" rx="5"/>
    <text class="class-name" x="550" y="630">Payment</text>
    <line class="line" x1="450" y1="640" x2="650" y2="640"/>
    <text class="attribute" x="460" y="660">-paymentId: String</text>
    <text class="attribute" x="460" y="680">-amount: Double</text>
    <text class="attribute" x="460" y="700">-token: String</text>
    <line class="line" x1="450" y1="710" x2="650" y2="710"/>
    <text class="method" x="460" y="730">+processPayment()</text>
    <text class="method" x="460" y="750">+refund()</text>
  </g>

  <!-- TransportRoute (bottom right) -->
  <g id="transport-route">
    <rect class="class-box" x="720" y="600" width="200" height="180" rx="5"/>
    <text class="class-name" x="820" y="630">TransportRoute</text>
    <line class="line" x1="720" y1="640" x2="920" y2="640"/>
    <text class="attribute" x="730" y="660">-routeId: String</text>
    <text class="attribute" x="730" y="680">-origin: String</text>
    <text class="attribute" x="730" y="700">-journeyTime: Integer</text>
    <text class="attribute" x="730" y="720">-isAccessible: Boolean</text>
    <line class="line" x1="720" y1="730" x2="920" y2="730"/>
    <text class="method" x="730" y="750">+calculateRoute()</text>
    <text class="method" x="730" y="770">+getDisruptions()</text>
  </g>

  <!-- AccessibilityPreference (bottom left) -->
  <g id="accessibility">
    <rect class="class-box" x="80" y="600" width="220" height="160" rx="5"/>
    <text class="class-name" x="190" y="630">AccessibilityPreference</text>
    <line class="line" x1="80" y1="640" x2="300" y2="640"/>
    <text class="attribute" x="90" y="660">-userId: String</text>
    <text class="attribute" x="90" y="680">-needsStepFree: Boolean</text>
    <text class="attribute" x="90" y="700">-hasBlueBadge: Boolean</text>
    <text class="attribute" x="90" y="720">-needsAudio: Boolean</text>
    <line class="line" x1="80" y1="730" x2="300" y2="730"/>
    <text class="method" x="90" y="750">+getPreferences()</text>
  </g>

  <!-- Inheritance arrows (Observer implementations) -->
  <!-- Triangle for UserObserver -->
  <polygon class="triangle" points="350,160 340,175 360,175"/>
  <line class="line" x1="350" y1="175" x2="350" y2="180"/>
  <line class="line" x1="350" y1="160" x2="550" y2="120"/>

  <!-- Triangle for NotificationObserver -->
  <polygon class="triangle" points="540,160 530,175 550,175"/>
  <line class="line" x1="540" y1="175" x2="540" y2="180"/>
  <line class="line" x1="540" y1="160" x2="550" y2="120"/>

  <!-- Association lines -->
  <!-- ObserverManager to Observer (dependency) -->
  <line class="line" stroke-dasharray="5,5" x1="750" y1="70" x2="650" y2="70"/>
  <polygon points="650,70 665,65 665,75" fill="black"/>

  <!-- Booking to ParkingSpot (composition) -->
  <polygon class="diamond" points="450,430 440,440 450,450 460,440"/>
  <line class="line" x1="440" y1="440" x2="280" y2="440"/>
  <text class="attribute" x="300" y="425" font-size="12">*</text>

  <!-- Booking to User (association) -->
  <line class="line" x1="650" y1="430" x2="720" y2="430"/>
  <text class="attribute" x="675" y="425" font-size="12">*</text>

  <!-- Booking to Payment (composition) -->
  <polygon class="diamond" points="550,510 540,520 550,530 560,520"/>
  <line class="line" x1="550" y1="530" x2="550" y2="600"/>
  <text class="attribute" x="560" y="570" font-size="12">1</text>

  <!-- User to TransportRoute (association) -->
  <line class="line" x1="820" y1="530" x2="820" y2="600"/>
  <text class="attribute" x="830" y="570" font-size="12">*</text>

  <!-- User to AccessibilityPreference (association) -->
  <line class="line" x1="720" y1="470" x2="300" y2="680"/>
  <text class="attribute" x="500" y="570" font-size="12">0..1</text>

</svg>